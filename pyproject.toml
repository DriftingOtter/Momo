[project]
name = "tensorlang"
version = "1.0.0"
description = "TensorLang — a tensor-oriented programming language for numerical computing, structured data, and symbolic mathematics."
authors = [
    {name = "Daksh Kaul", email = "dakshkaul7790@gmail.com"}
]
readme = "README.md"
license = "GPL-2.0-only"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    # polars>=1.21: rolling_* window functions require the min_samples
    # keyword (absent through 1.20.x — see M4 floor evidence).
    "polars>=1.21",
    "sympy>=1.12",
    # scipy>=1.11: 1.10.x ships no Python 3.12 wheels (supported floor
    # is >=3.12), forcing a source build — see M4 floor evidence.
    "scipy>=1.11",
    # Out-of-core execution (v0.5): validated against dask 2025.1 +
    # zarr 3.0.8 through dask 2026.8 + zarr 3.4.1. zarr 3.0.0 through
    # 3.0.7 are excluded (upstream yanks, including a zarr.load()
    # data-loss defect — see M4 floor evidence).
    "dask>=2025.1",
    "zarr>=3.0.8",
]

[project.optional-dependencies]
# Development extras: pytest runs the suite; scikit-learn and autograd
# are reference backends used by ML/AD tests (importorskip keeps the
# suite green without them, but CI installs this extra so nothing is
# silently skipped).
dev = ["pytest>=8.0", "scikit-learn>=1.3", "autograd>=1.6"]

[project.scripts]
tensorlang = "tensorlang.cli:main"
tl = "tensorlang.project:main"

[tool.poetry]
packages = [{include = "tensorlang", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
