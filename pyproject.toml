[project]
name = "tensorlang"
version = "0.9.0"
description = "TensorLang — a tensor-oriented programming language for numerical computing, structured data, and symbolic mathematics."
authors = [
    {name = "Daksh Kaul", email = "dakshkaul7790@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "sympy>=1.12",
    "scipy>=1.10",
    # Out-of-core execution (v0.5): validated against dask 2025.1 +
    # zarr 3.0.8 through dask 2026.8 + zarr 3.4.1. zarr 3.0.0 is
    # excluded (upstream yank: data-loss defect).
    "dask>=2025.1",
    "zarr>=3.0.1",
]

[project.optional-dependencies]
# Development extras: pytest runs the suite; scikit-learn and autograd
# are reference backends used by ML/AD tests (importorskip keeps the
# suite green without them, but CI installs this extra so nothing is
# silently skipped).
dev = ["pytest>=8.0", "scikit-learn>=1.3", "autograd>=1.6"]

[project.scripts]
tensorlang = "tensorlang.cli:main"
tl = "tensorlang.project:main"

[tool.poetry]
packages = [{include = "tensorlang", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
