name: TensorLang CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fast correctness suite
        run: python -m pytest tests/ -q -x
      - name: No silently skipped test modules
        run: |
          for f in tests/test_*.py; do
            out=$(python -m pytest "$f" --collect-only -q -p no:cacheprovider 2>&1 | tail -1)
            echo "$f: $out"
            echo "$out" | grep -q "no tests collected" && exit 1 || true
          done
      - name: Error catalogue sync (covered by tests, explicit gate)
        run: python -m pytest tests/test_error_codes.py -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Clean-install smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/tensorlang doctor
          /tmp/smoke/bin/tensorlang check examples/core_demo.tl
          /tmp/smoke/bin/tensorlang run examples/core_demo.tl
          /tmp/smoke/bin/tensorlang errors TL1030
          echo 'print("repl-ok")' | /tmp/smoke/bin/tensorlang repl | grep repl-ok

  benchmarks:
    # Expensive and noisy: manual dispatch only, never a PR gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install with benchmark deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full benchmark suite (small+medium)
        run: python benchmarks/run_all.py --sizes small medium

  project:
    # Project-manager integration: real uv execution (network required).
    # Skipped tl tests must be reported, never silent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Project integration suite (uv-backed)
        run: python -m pytest tests/test_tl.py -q -rs
      - name: Managed project end-to-end
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          rm -rf /tmp/tlci && mkdir -p /tmp/tlci && cd /tmp/tlci
          tl new ciapp --tensorlang "$GITHUB_WORKSPACE"
          cd ciapp
          tl sync
          tl run
          tl add --dev pytest
          tl sync
          tl test
          tl check
          tl doctor
